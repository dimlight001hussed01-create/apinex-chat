<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude — APInex</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#252422;--muted:#77736c;--line:#e7e4de;--accent:#d97757;--accent2:#c96647;--user:#eeeae3;--shadow:0 8px 30px rgba(30,25,20,.08)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:270px;background:#f1f0ec;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px}.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;padding:8px 8px 18px}.logo{width:30px;height:30px;border-radius:9px;background:#d97757;color:#fff;display:grid;place-items:center;font-weight:800}.new{width:100%;border:1px solid #d9d5cd;background:#fff;border-radius:12px;padding:11px 13px;text-align:left;font-weight:650;cursor:pointer}.new:hover{background:#faf9f6}.history{margin-top:18px;overflow:auto;flex:1}.history-title{font-size:11px;color:var(--muted);font-weight:700;padding:8px}.history-item{padding:10px 9px;border-radius:9px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history-item:hover{background:#e7e5df}.side-bottom{font-size:12px;color:var(--muted);padding:10px 8px}.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(231,228,222,.65);background:rgba(247,247,245,.92);backdrop-filter:blur(10px);position:relative;z-index:2}.lefttop{display:flex;align-items:center;gap:8px}.menu{display:none;border:0;background:transparent;font-size:22px;padding:7px;border-radius:8px}.model-btn{border:0;background:transparent;font-weight:650;font-size:15px;color:var(--text);padding:8px 10px;border-radius:9px;cursor:pointer}.model-btn:hover{background:#eceae5}.model-sub{font-size:11px;color:var(--muted);font-weight:500}.gear{border:0;background:transparent;font-size:18px;padding:8px;cursor:pointer;border-radius:9px}.gear:hover{background:#eceae5}.chat{flex:1;overflow:auto}.welcome{max-width:760px;margin:0 auto;padding:15vh 24px 30px}.welcome h1{font-size:32px;line-height:1.15;margin:0 0 9px;font-weight:650;letter-spacing:-.8px}.welcome p{color:var(--muted);margin:0;font-size:15px}.messages{max-width:820px;margin:0 auto;padding:24px 22px 150px}.row{display:flex;gap:12px;margin:22px 0}.row.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}.avatar.claude{background:#d97757;color:white}.avatar.me{background:#d9d6d0;color:#4c4944}.bubble{max-width:min(720px,86%);font-size:15px;line-height:1.65}.user .bubble{background:var(--user);padding:11px 15px;border-radius:18px;color:#2d2b28}.assistant .bubble{padding:1px 0}.bubble pre{background:#242321;color:#f7f5ef;padding:14px;border-radius:12px;overflow:auto}.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.files{margin-top:8px;display:flex;flex-wrap:wrap;gap:7px}.file{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;color:#5e5a54}.composer-wrap{position:fixed;bottom:0;left:270px;right:0;padding:18px 20px 20px;background:linear-gradient(transparent,var(--bg) 30%)}.composer{max-width:820px;margin:auto;background:#fff;border:1px solid #d9d6d0;border-radius:18px;box-shadow:var(--shadow);padding:10px 12px 9px}.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:45px;max-height:150px;padding:5px 4px;font-size:15px;background:transparent;color:var(--text)}.composer-row{display:flex;align-items:center;justify-content:space-between}.tools{display:flex;align-items:center;gap:5px}.icon{border:0;background:transparent;border-radius:9px;padding:8px;cursor:pointer;color:#625e57}.icon:hover{background:#f1efeb}.send{border:0;width:36px;height:36px;border-radius:11px;background:#252422;color:#fff;cursor:pointer;font-size:17px}.send:disabled{opacity:.35;cursor:default}.selected{font-size:12px;color:var(--muted);padding:4px 5px;display:flex;gap:6px;overflow:auto;white-space:nowrap}.panel{display:none;position:fixed;top:62px;right:15px;width:min(350px,calc(100vw - 30px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;z-index:5}.panel.show{display:block}.panel label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:8px 0 5px}.field{width:100%;border:1px solid #d9d6d0;border-radius:9px;padding:9px;background:#faf9f7;outline:0}.field:focus{border-color:#c9a493}.note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:9px}.danger{margin-top:12px;border:0;border-radius:9px;padding:9px 11px;background:#f8dfd8;color:#8b3d28;cursor:pointer}.typing{display:inline-flex;gap:4px;align-items:center}.dot{width:5px;height:5px;background:#aaa;border-radius:50%;animation:b 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(2px)}}@media(max-width:700px){.sidebar{display:none}.menu{display:block}.composer-wrap{left:0;padding:12px 10px 12px}.topbar{height:58px;padding:0 10px}.welcome{padding:18vh 20px 30px}.welcome h1{font-size:29px}.messages{padding:18px 15px 130px}.bubble{max-width:90%}.avatar{width:28px;height:28px;flex-basis:28px}.row{gap:9px;margin:19px 0}}
</style></head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">C</div>Claude</div><button class="new" id="newChat">＋ New chat</button><div class="history"><div class="history-title">RECENT</div><div id="historyList"></div></div><div class="side-bottom">Powered by APInex · Claude-compatible</div></aside>
<main class="main">
<header class="topbar"><div class="lefttop"><button class="menu" id="menu">☰</button><button class="model-btn" id="modelBtn">Claude <span class="model-sub">⌄</span></button></div><button class="gear" id="settings">⚙</button></header>
<div class="panel" id="panel"><label>Claude model ID</label><input class="field" id="model" placeholder="APInex-এর exact Claude model ID"><label>API mode</label><select class="field" id="mode"><option value="messages">Claude Messages API</option><option value="chat">OpenAI-compatible Chat API</option></select><div class="note">API key এখানে রাখবেন না। Render-এর Environment Variables-এ নতুন APInex key রাখুন।</div><button class="danger" id="clear">Clear current chat</button></div>
<div class="chat" id="chat"><div class="welcome" id="welcome"><h1>How can I help you today?</h1><p>Ask anything. You can also attach images and files.</p></div><div class="messages" id="messages"></div></div>
<div class="composer-wrap"><div class="composer"><div id="selected" class="selected"></div><textarea id="input" rows="1" placeholder="Message Claude..."></textarea><div class="composer-row"><div class="tools"><label class="icon" title="Attach files">＋<input id="picker" type="file" multiple hidden accept="image/*,.zip,.rar,.7z,.pdf,.txt,.md,.csv,.json,.doc,.docx,.xls,.xlsx"></label><button class="icon" title="Model settings" id="modelMini">◐</button></div><button class="send" id="send" disabled>↑</button></div></div></div>
</main></div>
<script>
const chat=document.querySelector('#chat'),messages=document.querySelector('#messages'),welcome=document.querySelector('#welcome'),input=document.querySelector('#input'),picker=document.querySelector('#picker'),selected=document.querySelector('#selected'),model=document.querySelector('#model'),mode=document.querySelector('#mode');
let history=JSON.parse(localStorage.getItem('ac_history')||'[]'); model.value=localStorage.getItem('ac_model')||''; mode.value=localStorage.getItem('ac_mode')||'messages';
function save(){localStorage.setItem('ac_model',model.value);localStorage.setItem('ac_mode',mode.value);localStorage.setItem('ac_history',JSON.stringify(history.slice(-40)))}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function format(s){let x=esc(s);x=x.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>');x=x.replace(/\n/g,'<br>');return x}
function render(){messages.innerHTML='';welcome.style.display=history.length?'none':'block';history.forEach(m=>{let row=document.createElement('div');row.className='row '+(m.role==='user'?'user':'assistant');let av=document.createElement('div');av.className='avatar '+(m.role==='user'?'me':'claude');av.textContent=m.role==='user'?'You':'C';let b=document.createElement('div');b.className='bubble';b.innerHTML=format(m.text||'');if(m.files?.length){let fs=document.createElement('div');fs.className='files';m.files.forEach(n=>{let f=document.createElement('div');f.className='file';f.textContent='📎 '+n;fs.appendChild(f)});b.appendChild(fs)}if(m.role==='user')row.append(b,av);else row.append(av,b);messages.appendChild(row)});chat.scrollTop=chat.scrollHeight;updateHistory()}
function updateHistory(){let h=document.querySelector('#historyList');h.innerHTML='';history.filter(x=>x.role==='user').slice(-8).reverse().forEach(m=>{let d=document.createElement('div');d.className='history-item';d.textContent=m.text||'Attachment';h.appendChild(d)})}
function addUser(text,files){history.push({role:'user',text,files:files.map(f=>f.name)});render()}
picker.onchange=()=>{selected.textContent=picker.files.length?[...picker.files].map(f=>'📎 '+f.name).join('  ·  '):'';updateSend()};
function updateSend(){document.querySelector('#send').disabled=!input.value.trim()&&!picker.files.length}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';updateSend()});
function togglePanel(){document.querySelector('#panel').classList.toggle('show')}
document.querySelector('#settings').onclick=togglePanel;document.querySelector('#modelMini').onclick=togglePanel;document.querySelector('#modelBtn').onclick=togglePanel;[model,mode].forEach(x=>x.oninput=save);
document.querySelector('#clear').onclick=()=>{history=[];save();render();document.querySelector('#panel').classList.remove('show')};
document.querySelector('#newChat').onclick=()=>{history=[];save();render();input.focus()};
document.querySelector('#menu').onclick=()=>alert('New chat ব্যবহার করতে নিচের sidebar-এর পরিবর্তে + New chat বোতামটি ব্যবহার করুন।');
async function send(){let text=input.value.trim(),files=[...picker.files];if(!text&&!files.length)return;if(!model.value.trim()){togglePanel();alert('Settings থেকে APInex-এর exact Claude model ID দিন।');return}addUser(text||'ফাইল পাঠানো হয়েছে',files);input.value='';picker.value='';selected.textContent='';input.style.height='auto';history.push({role:'assistant',text:'__typing__'});render();const fd=new FormData();fd.append('message',text);fd.append('model',model.value.trim());fd.append('mode',mode.value);fd.append('history',JSON.stringify(history.slice(0,-1)));files.forEach(f=>fd.append('files',f));try{let r=await fetch('/api/chat',{method:'POST',body:fd});let data=await r.json();if(!r.ok)throw new Error(data.error||('HTTP '+r.status));history[history.length-1].text=data.reply||'No response.'}catch(e){history[history.length-1].text='❌ '+e.message}save();render();}
document.querySelector('#send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});render();
</script></body></html>
